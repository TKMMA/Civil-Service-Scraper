name: RCUH Probe

# One-off check: can GitHub's servers read the RCUH job list?
# Manual trigger only. Reads nothing from and writes nothing to the repo.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Try the RCUH job list
        shell: python
        run: |
          import re, requests
          BASE = "https://hr.rcuh.com/psc/hcmprd_exapp/EMPLOYEE/HRMS/c/HRS_HRAM_FL.HRS_CG_SEARCH_FL.GBL"
          LIST = BASE + "?Page=HRS_APP_SCHJOB_FL&Action=U"
          s = requests.Session()
          s.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
          })
          TITLE = re.compile(r"id=['\"]SCH_JOB_TITLE\$\d+['\"]>([^<]*)<")
          JOBID = re.compile(r"id=['\"]HRS_APP_JBSCH_I_HRS_JOB_OPENING_ID\$\d+['\"]>([^<]*)<")
          titles, ids = [], []
          for attempt in range(1, 4):
              r = s.get(LIST, timeout=45)
              found = re.search(r"(\d+) jobs? found", r.text)
              titles, ids = TITLE.findall(r.text), JOBID.findall(r.text)
              print(f"attempt {attempt}: HTTP {r.status_code}, {len(r.text)} bytes, "
                    f"redirects {[h.status_code for h in r.history]}, "
                    f"cookies {sorted(s.cookies.keys())}, found {found.group(1) if found else None}, "
                    f"rows {len(titles)}", flush=True)
              if titles:
                  break
          if not titles:
              print(re.sub(r"\s+", " ", r.text)[:1500])
              raise SystemExit("No job rows found")
          print("first titles:", titles[:5])
          d = s.get(BASE + "?Page=HRS_APP_JBPST_FL&Action=U&FOCUS=Applicant&SiteId=1"
                    f"&JobOpeningId={ids[0].strip()}&PostingSeq=1", timeout=45)
          print(f"detail {ids[0].strip()}: HTTP {d.status_code}, {len(d.text)} bytes, "
                f"has DUTIES: {'DUTIES' in d.text}, has title: {titles[0].strip()[:30] in d.text}")
